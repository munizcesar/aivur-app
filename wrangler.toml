name = "aivur-app"
compatibility_date = "2024-12-01"
compatibility_flags = [ "nodejs_compat" ]
pages_build_output_dir = ".vercel/output/static"

# Binding para Workers AI
[ai]
binding = "AI"

# Binding para o Banco de Dados Relacional
[[d1_databases]]
binding = "D1_DB"
database_name = "aivur-db"
database_id = "0c75d334-f109-46b6-8e3b-d2e47164a157"

[[d1_databases]]
binding = "DB"
database_name = "aivur-questoes"
database_id = "c89abdb7-6f74-424d-9012-6551e6e1a5d2"

# Binding para o Banco de Dados Vetorial
[[vectorize]]
binding = "VECTORIZE"
index_name = "aivur-vector-index"

# -----------------------------------------------------------------------------
# Ambiente Preview (Isolamento estrito para Pull Requests e branch deployments)
# -----------------------------------------------------------------------------
[env.preview.ai]
binding = "AI"

[[env.preview.d1_databases]]
binding = "D1_DB"
database_name = "aivur-db-preview"
database_id = "4e6886cf-d847-4a5a-af8a-22d55b2aaede"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "aivur-questoes-preview"
database_id = "9c7e8aa9-c209-4109-b554-63c873b1752f"

[[env.preview.vectorize]]
binding = "VECTORIZE"
index_name = "aivur-vector-index-preview"
