name = "aivur-app"
compatibility_date = "2024-02-08"
compatibility_flags = [ "nodejs_compat" ]
pages_build_output_dir = ".vercel/output/static"

# KV Namespace para Cache Semântico (RAG_CACHE)
# Descomente e preencha o id após criar com: npx wrangler kv namespace create RAG_CACHE
# [[kv_namespaces]]
# binding = "RAG_CACHE"
# id = "PREENCHER_COM_ID_REAL"

# Binding para Workers AI
[ai]
binding = "AI"

# Binding para o Banco de Dados Relacional (Filtro Híbrido)
[[d1_databases]]
binding = "D1_DB"
database_name = "aivur-db"
database_id = "0c75d334-f109-46b6-8e3b-d2e47164a157"

# Binding para o Banco de Dados Vetorial (Busca Semântica)
[[vectorize]]
binding = "VECTORIZE"
index_name = "aivur-vector-index"

